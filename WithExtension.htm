<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medium Level UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
  background: #2563eb;
  color: white;
  padding: 15px;
  text-align: center;
}

/* Container */
.container {
  padding: 20px;
}

/* Cards */
.cards {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.card {
  flex: 1 1 200px;
  background: #f3f4f6;
  padding: 15px;
  border-radius: 8px;
}

/* Form */
form {
  margin-top: 20px;
}

input, button {
  padding: 10px;
  margin-top: 10px;
  width: 100%;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <h2>My Website</h2>
</div>

<div class="container">

  <!-- Cards -->
  <div class="cards">
    <div class="card">
      <h3>Card 1</h3>
      <p>Simple content block.</p>
    </div>
    <div class="card">
      <h3>Card 2</h3>
      <p>Another content block.</p>
    </div>
    <div class="card">
      <h3>Card 3</h3>
      <p>Yet another one.</p>
    </div>
  </div>

  <!-- Form -->
  <form onsubmit="handleSubmit(event)">
    <h3>Contact Form</h3>
    <input type="text" id="name" placeholder="Enter your name">
    <input type="email" id="email" placeholder="Enter your email">
    <button type="submit">Submit</button>
  </form>

</div>

<script>
function handleSubmit(e) {
  e.preventDefault();

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;

  if (name === "" || email === "") {
    alert("Please fill all fields");
  } else {
    alert("Form submitted successfully!");
  }
}
</script>

</body>
</html>
